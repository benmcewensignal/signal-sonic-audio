name: audio
on:
  workflow_dispatch:
    inputs:
      task:
        description: what to run
        type: choice
        options: [rhythm, olaf-bench, olaf-bench-small]
        default: rhythm
permissions:
  contents: write
concurrency:
  group: sonic-audio
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg build-essential >/dev/null
          pip install -q numpy librosa soundfile yt-dlp
      - name: fetch the pipeline database
        run: |
          curl -sL -o sonic.db https://raw.githubusercontent.com/benmcewensignal/signal-sonic/main/sonic.db
          python -c "import sqlite3; c=sqlite3.connect('sonic.db'); print('tracks', c.execute(\"select count(*) from tracks\").fetchone()[0], '| nts truth lines', c.execute('select count(*) from nts_tracklist where track_id is not null').fetchone()[0])"
      - name: build olaf
        if: startsWith(inputs.task, 'olaf')
        run: python -m audio.olaf build

      - name: rhythm and loudness pass
        if: inputs.task == 'rhythm'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: |
          pip install -q essentia-tensorflow
          python -m audio.rhythm --db sonic.db --limit 400 --budget-minutes 75 --out-dir out
      - name: olaf benchmark (small batch, errors recorded)
        if: inputs.task == 'olaf-bench-small'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: python -m audio.bench --db sonic.db --out out/olaf-bench.json --controls 60 --mixes 3

      - name: olaf benchmark against NTS truth
        if: inputs.task == 'olaf-bench'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: python -m audio.bench --db sonic.db --out out/olaf-bench.json
      - name: persist results
        if: always()
        run: |
          git config user.name "sonic-audio-bot"; git config user.email "sonic@earlysignal.live"
          git add -A out 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "audio: $(date -u +%FT%TZ)" && git pull -q --no-rebase origin main && git push -q origin HEAD:main) || echo "nothing to persist"

      - name: chain the next run while records remain
        if: always() && inputs.task == 'rhythm'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(python -c "
          import json,os,sqlite3
          have=set()
          for f in os.listdir('out'):
              if f.startswith('rhythm-'):
                  for l in open('out/'+f):
                      try: have.add(json.loads(l)['track_id'])
                      except Exception: pass
          c=sqlite3.connect('sonic.db')
          n=sum(1 for (t,) in c.execute(\"select track_id from tracks where analyser_id='local' and track_id like 'bp:%'\") if t not in have)
          print(n)")
          echo "$LEFT records still without rhythm measurements"
          if [ "$LEFT" -gt 0 ]; then gh workflow run audio.yml --ref main -f task=rhythm && echo "follow-up dispatched"; fi
