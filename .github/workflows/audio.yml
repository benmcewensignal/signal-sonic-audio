name: audio
on:
  # Stopping when a pass measures nothing was the right fix and left nothing to start it
  # again: this workflow had workflow_dispatch and no schedule, so it stood down for
  # fourteen hours while the corpus grew underneath it. Hourly, and the stop condition
  # means a pass with no work costs one short run rather than a loop.
  schedule:
    - cron: "40 * * * *"    # hourly: measure whatever is unmeasured
    - cron: "15 4 * * *"    # once a day: rehearse recognition
    - cron: "45 5 * * *"    # once a day: rebuild the recognition index, since names grow daily even when the store does not
  workflow_dispatch:
    inputs:
      task:
        description: what to run
        type: choice
        options: [rehearse, rhythm, history, canon, fp-top, full-index, demo-index, olaf-bench, olaf-bench-small]
        default: rhythm
permissions:
  contents: write
  actions: write
concurrency:
  # keyed on the task: GitHub keeps only one pending run per group, so a chain that
  # dispatches continuously evicts anything else waiting. Four index rebuilds were
  # cancelled in the pending slot today without ever starting.
  group: sonic-audio-${{ inputs.task }}
  cancel-in-progress: false
jobs:
  run:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg build-essential >/dev/null
          pip install -q numpy librosa soundfile yt-dlp
      - name: fetch the pipeline database
        run: |
          # the repository copy lags the deepened release, where the re-measured records
          # live. Take whichever holds more records on the current analyser, because the
          # index carries their measures and a stale copy silently drops the new ones.
          curl -sL -o repo.db https://raw.githubusercontent.com/benmcewensignal/signal-sonic/main/sonic.db
          # sonic now saves this release after every queue run, swapping the file in; a single try
          # could land in that moment and fail the run, so try three times
          # the release is saved far more often now (every queue run, the tracklist import), so a fetch
          # can land in a swap more often: five tries, spaced further apart
          for i in 1 2 3 4 5; do
            gh release download deepened --repo benmcewensignal/signal-sonic --pattern sonic.db --dir rel --clobber 2>/dev/null && [ -s rel/sonic.db ] && break
            echo "fetch attempt $i missed; retrying"; sleep $((i*20))
          done
          python - <<'PY'
          import os, shutil, sqlite3
          def score(p):
              try:
                  c = sqlite3.connect(p)
                  rows = c.execute("select coalesce(analyser_ver,'1') v, count(*) n "
                                   "from tracks where analyser_id='local' group by v")
                  return sum(n for v, n in rows if not str(v).startswith(("1", "2+", "2.0", "2.1", "2.2")))
              except Exception:
                  return -1
          a, b = score("repo.db"), score("rel/sonic.db") if os.path.exists("rel/sonic.db") else -1
          print(f"repository copy has {a} recent records, the deepened release {b}")
          # A failed release download fell through to the repository copy in silence. Those
          # records sit at analyser version two, which predates the edm block, so the index
          # built from them lost sub_bass and pulse_clarity and the walk lost two directions.
          if b < 0:
              raise SystemExit("could not read the deepened release; refusing to index from the "
                               "repository copy, which lags it badly")
          shutil.copy("rel/sonic.db" if b > a else "repo.db", "sonic.db")
          import sqlite3 as _s
          _c = _s.connect("sonic.db")
          _n = _c.execute("select count(*) from tracks").fetchone()[0]
          _e = _c.execute("select count(*) from tracks where analyser_id='local' "
                          "and features like '%sub_bass%'").fetchone()[0]
          print(f"indexing from {_n} records, {_e} carrying the edm measures", flush=True)
          if _e < _n * 0.2:
              raise SystemExit(f"only {_e} of {_n} records carry sub_bass: the index would drop "
                               f"two walk directions")
          print("using", "the deepened release" if b > a else "the repository copy")
          PY
          python -c "import sqlite3; c=sqlite3.connect('sonic.db'); print('tracks', c.execute(\"select count(*) from tracks\").fetchone()[0], '| nts truth lines', c.execute('select count(*) from nts_tracklist where track_id is not null').fetchone()[0])"
      - name: build olaf
        if: startsWith(inputs.task, 'olaf')
        run: python -m audio.olaf build

      - name: fingerprint Beatport history
        if: inputs.task == 'history'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: python -m audio.fp_history --meta sonic.db --out out/fp-history.jsonl --from 2016-01 --per-month 8 --budget-minutes 80

      - name: chain the history pass while it is adding records
        if: always() && inputs.task == 'history'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LEFT=$(python -c "import json;s=json.load(open('out/history-state.json'));print(s.get('months_left', 1))" 2>/dev/null || echo 1)
          DID=$(python -c "import json;s=json.load(open('out/history-state.json'));print(len(s.get('done_months',[])))" 2>/dev/null || echo 0)
          echo "months done: $DID"
          if [ "$LEFT" -le 0 ]; then echo "every month walked; finished"; exit 0; fi
          gh workflow run audio.yml --ref main -f task=history && echo "follow-up dispatched"
          exit 0

      - name: rehearse recognition against real records
        if: inputs.task == 'rehearse' || github.event.schedule == '15 4 * * *'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: |
          python -m audio.rehearse --n 20 --clips 3 --seconds 15 --out out/rehearse-15.json
          python -m audio.rehearse --n 20 --clips 3 --seconds 25 --out out/rehearse-25.json

      - name: borrow the analyser for the canon pass
        if: inputs.task == 'canon'
        run: |
          set -e
          # this repository has no sonic package, so the import silently failed and 158
          # canon records were fingerprinted and none measured. Fetch it rather than vendor
          # a copy, so there is one analyser and it cannot drift.
          mkdir -p sonic
          for f in __init__.py analyser.py analyser_local.py; do
            curl -sL -o "sonic/$f" "https://raw.githubusercontent.com/benmcewensignal/signal-sonic/main/sonic/$f" || true
          done
          touch sonic/__init__.py
          python -c "from sonic.analyser_local import LocalAnalyser; print('analyser available:', LocalAnalyser().version)"

      - name: fingerprint the canon
        if: inputs.task == 'canon'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: python -m audio.canon --out out/fp-canon.jsonl --budget-minutes 80

      - name: fingerprint the biggest records
        if: inputs.task == 'fp-top'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: python -m audio.fp_top --meta sonic.db --out out/fp-extra.jsonl --limit 400 --budget-minutes 80

      - name: build the full recognition index
        if: inputs.task == 'full-index' || github.event.schedule == '45 5 * * *'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}   # the deepened release lives in another repository, and the default token cannot read it: the guard that refuses to index from the lagging copy was firing on a permissions failure, not a stale release
        run: |
          # I cannot read CI logs from where I work, so five failures in a row were diagnosed
          # by guessing. Everything this step says goes to a file that is committed, the way
          # the queue runner already does it.
          exec > >(tee -a /tmp/indexlog.txt) 2>&1
          set +e
          set -e
          echo "fetching the fingerprint store (about 1 GB)"
          # the store is kept as compressed parts under GitHub's 2 GiB cap (scripts/fpstore.sh)
          GH_TOKEN="${{ secrets.PIPELINE_PAT || github.token }}" bash scripts/fpstore.sh fetch benmcewensignal/signal-sonic fingerprints.db
          ls -la fingerprints.db
          python -c "import sqlite3;print('records in store:', sqlite3.connect('fingerprints.db').execute('select count(*) from fp_tracks').fetchone()[0])"
          # The stem measures come from the features repository. Every part of this is wrapped so it
          # cannot take the index build down with it: the index building at all matters more than
          # the per-stem neighbours, and the build has failed three times since I added this.
          set +e
          curl -sL -o stems.tar "https://api.github.com/repos/benmcewensignal/signal-sonic-features/tarball/main" \
            -H "Authorization: Bearer ${{ secrets.PIPELINE_PAT || github.token }}" --max-time 120
          mkdir -p stemsrc && tar -xf stems.tar -C stemsrc --strip-components=1 2>/dev/null
          STEMN=$(ls stemsrc/out/stems-*.jsonl 2>/dev/null | wc -l)
          echo "stem files fetched: ${STEMN}"
          set -e
          if [ "${STEMN:-0}" -gt 0 ]; then
            python -m audio.build_index --db fingerprints.db --meta sonic.db --out out/index \
              --stems-glob "stemsrc/out/stems-*.jsonl" || \
            python -m audio.build_index --db fingerprints.db --meta sonic.db --out out/index
          else
            python -m audio.build_index --db fingerprints.db --meta sonic.db --out out/index
          fi
          python - <<'PY'
          import json
          d = json.load(open("out/index.json"))
          t = d["tracks"]
          n8 = sum(1 for x in t if x.get("near") and len(x["near"]) >= 8)
          nid = sum(1 for x in t if x.get("near") and x["near"][0].get("id"))
          wk = sum(1 for x in t if x.get("walk"))
          print(f"VERIFY: {len(t)} records, eight-neighbour {n8}, with ids {nid}, walks {wk}")
          det = json.load(open("out/index-detail.json"))
          n8 = sum(1 for v in det.values() if v.get("near") and len(v["near"]) >= 8)
          wk = sum(1 for v in det.values() if v.get("walk"))
          import os
          print(f"VERIFY: index {os.path.getsize('out/index.json')/1e6:.1f} MB, "
                f"detail {os.path.getsize('out/index-detail.json')/1e6:.1f} MB, "
                f"eight-neighbour {n8}, walks {wk}")
          if n8 == 0 or wk == 0:
              raise SystemExit("the detail file was written without neighbours or walks")
          if os.path.getsize("out/index.json") > 9_000_000:
              raise SystemExit("the index the api loads is too large; it must stay lean")
          PY
          ls -la out/index.bin out/index.json
          rm -f fingerprints.db

      - name: keep the index log where it can be read
        if: always()
        run: |
          set +e
          mkdir -p out
          tail -c 60000 /tmp/indexlog.txt > out/index-build-log.txt 2>/dev/null || echo 'no log captured' > out/index-build-log.txt
          git config user.name 'sonic-audio-bot'; git config user.email 'sonic@earlysignal.live'
          git add out/index-build-log.txt
          git commit -qm 'index build log' || true
          git pull -q --no-rebase origin main || true
          git push -q origin HEAD:main || true
          exit 0
      - name: publish the index as a release asset
        if: inputs.task == 'full-index' || github.event.schedule == '45 5 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Never delete first. Between the delete and the upload the index does not exist and
          # every listen returns 404 — for a two hundred megabyte file that window is minutes
          # long, so each rebuild took the page down. Create only if missing, then clobber the
          # asset in place, which swaps it atomically.
          gh release view recognition-index >/dev/null 2>&1 \
            || gh release create recognition-index --title "recognition index" --notes "sorted hash postings for the whole corpus"
          if ! gh release upload recognition-index out/index.bin --clobber; then
            echo "::error::could not publish the index; the previous one is still in place"
            exit 1
          fi
          git config user.name "sonic-audio-bot"; git config user.email "sonic@earlysignal.live"
          git add out/index.json && git commit -qm "recognition index metadata" && git pull -q --no-rebase origin main && git push -q origin HEAD:main
          exit 0

      - name: build the recognition demo index
        if: inputs.task == 'demo-index'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: python -m audio.demo_index --db sonic.db --out out/demo-index.json --per-scene 10 --seconds 45 --budget-minutes 80

      - name: rhythm and loudness pass
        if: inputs.task == 'rhythm'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: |
          pip install -q essentia-tensorflow
          python -m audio.rhythm --db sonic.db --limit 400 --budget-minutes 75 --out-dir out
      - name: olaf benchmark (small batch, errors recorded)
        if: inputs.task == 'olaf-bench-small'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: python -m audio.bench --db sonic.db --out out/olaf-bench.json --controls 60 --mixes 3

      - name: olaf benchmark against NTS truth
        if: inputs.task == 'olaf-bench'
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: python -m audio.bench --db sonic.db --out out/olaf-bench.json
      - name: persist results
        if: always()
        run: |
          git config user.name "sonic-audio-bot"; git config user.email "sonic@earlysignal.live"
          git add -A out 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "audio: $(date -u +%FT%TZ)" && git pull -q --no-rebase origin main && git push -q origin HEAD:main) || echo "nothing to persist"

      - name: stand down if a one-off build is waiting
        id: yield
        if: inputs.task == 'rhythm' || inputs.task == 'history'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # A self-requeuing chain starves every one-off job: four index rebuilds were cut
          # off today because rhythm re-booked the runner before they could start. If a
          # build is queued, this run does not chain, and the runner falls free.
          q=$(gh run list --repo ${{ github.repository }} --limit 20 --json status,displayTitle,databaseId \
                --jq '[.[] | select(.status=="queued")] | length' 2>/dev/null)
          echo "queued=${q:-0}" >> "$GITHUB_OUTPUT"
          echo "one-off jobs waiting: ${q:-0}"
          exit 0

      - name: chain the next run while records remain
        if: (always() && inputs.task == 'rhythm') && steps.yield.outputs.queued == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m audio.remaining > /tmp/left.txt 2>/dev/null
          LEFT=$(cat /tmp/left.txt 2>/dev/null | tail -1)
          echo "records still without rhythm measurements: ${LEFT:-unknown}"
          # unknown chains, as in the deepen workflow: an idle runner overnight costs far
          # more than one wasted pass, and this chain has stopped silently all weekend.
          case "$LEFT" in ''|*[!0-9]*) echo "could not count; chaining anyway"; LEFT=-1;; esac
          # the index build shares this runner and the demo needs it: until it exists,
          # rhythm does not re-arm. No marker file to forget to commit.
          # the corpus build has priority: rhythm does not re-arm while it is unfinished
          if [ ! -f out/fp-history.jsonl ]; then echo "corpus build not started; yielding the runner"; exit 0; fi
          if [ -f out/.corpus-running ]; then echo "corpus build in flight; yielding the runner"; exit 0; fi
          # -1 means the count was unreadable, and that chains too: an idle runner overnight
          # costs eight hours, a wasted pass twenty minutes.
          if [ "$LEFT" -gt 0 ] || [ "$LEFT" -eq -1 ]; then
            # Forty-eight thousand nine hundred and ninety-eight rhythm records, unchanged across six
            # commits while this booked itself every ninety seconds. The same fault the stems chain
            # had: a count that cannot answer, and unknown set to chain. Stop on what was produced.
            NOW=$(cat out/rhythm-*.jsonl 2>/dev/null | wc -l)
            PREV=$(git show HEAD~1:out/rhythm-count.txt 2>/dev/null || echo 0)
            echo "rhythm records now ${NOW}, at the previous commit ${PREV}"
            echo "${NOW}" > out/rhythm-count.txt
            git add out/rhythm-count.txt >/dev/null 2>&1 || true
            git commit -qm "rhythm count ${NOW}" >/dev/null 2>&1 || true
            git push -q origin main >/dev/null 2>&1 || true
            if [ "${NOW}" = "${PREV}" ]; then
              echo "the last pass measured nothing: standing down rather than booking another"
              exit 0
            fi
            if gh workflow run audio.yml --ref main -f task=rhythm; then
              echo "next rhythm pass dispatched"
            else
              echo "::error::dispatch failed - the rhythm chain is broken"
              exit 1
            fi
          else
            echo "nothing left to measure; standing down"
          fi
          exit 0
