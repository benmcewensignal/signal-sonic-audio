name: dense e2e
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q numpy librosa soundfile
      - run: python -m tests.dense_e2e
      - name: keep the result
        run: |
          git config user.name "sonic-bot"; git config user.email "sonic@earlysignal.live"; git add data/dense-e2e.json
          git commit -qm "dense e2e: $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*15)); done
